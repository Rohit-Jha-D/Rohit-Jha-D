<svg fill="none" width="100%" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.8; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-8px); }
        }

        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100%); }
        }

        .banner-container {
          width: 100%;
          height: 240px;
          background: linear-gradient(-45deg, #0b0f19, #111827, #0d1b2a, #1a0b2e);
          background-size: 400% 400%;
          animation: gradient 12s ease infinite;
          border-radius: 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
          border: 1px solid rgba(0, 242, 254, 0.2);
          font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
          background-size: 30px 30px;
          mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        .glowing-orb-1 {
          position: absolute;
          width: 180px;
          height: 180px;
          background: #00f2fe;
          filter: blur(80px);
          opacity: 0.35;
          top: -40px;
          left: 10%;
          animation: float 6s ease-in-out infinite;
        }

        .glowing-orb-2 {
          position: absolute;
          width: 200px;
          height: 200px;
          background: #7928ca;
          filter: blur(90px);
          opacity: 0.35;
          bottom: -50px;
          right: 10%;
          animation: float 8s ease-in-out infinite reverse;
        }

        .content {
          position: relative;
          z-index: 10;
          text-align: center;
          padding: 0 20px;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 14px;
          background: rgba(0, 242, 254, 0.1);
          border: 1px solid rgba(0, 242, 254, 0.3);
          border-radius: 50px;
          color: #00f2fe;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          margin-bottom: 12px;
          backdrop-filter: blur(8px);
        }

        .main-title {
          font-size: 36px;
          font-weight: 800;
          margin: 0 0 8px 0;
          background: linear-gradient(135deg, #ffffff 0%, #00f2fe 50%, #4facfe 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: 1px;
          text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .subtitle {
          font-size: 15px;
          color: #94a3b8;
          margin: 0 0 16px 0;
          font-weight: 400;
          letter-spacing: 0.5px;
        }

        .highlights-row {
          display: flex;
          gap: 12px;
          justify-content: center;
          flex-wrap: wrap;
        }

        .tag-pill {
          padding: 4px 12px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 6px;
          color: #cbd5e1;
          font-size: 12px;
          font-weight: 500;
          transition: all 0.3s ease;
        }
      </style>

      <div class="banner-container">
        <div class="grid-bg"></div>
        <div class="glowing-orb-1"></div>
        <div class="glowing-orb-2"></div>
        
        <div class="content">
          <div class="badge-pill">
            <span>✨ SENIOR DATA ANALYTICS &amp; ML PORTFOLIO</span>
          </div>
          <h1 class="main-title">ROHIT JHA D</h1>
          <p class="subtitle">Data Analyst | Business Intelligence | Machine Learning Engineer</p>
          
          <div class="highlights-row">
            <span class="tag-pill">📊 Power BI &amp; SQL</span>
            <span class="tag-pill">🐍 Python &amp; Scikit-Learn</span>
            <span class="tag-pill">🏛️ Ex-HPCL Trainee</span>
            <span class="tag-pill">🛡️ C-DAC ML Intern</span>
            <span class="tag-pill">🎓 Google Certified</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
